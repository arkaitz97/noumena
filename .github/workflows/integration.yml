name: integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (vet, fmt, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: gofmt gate
        run: make fmt-check

      - name: go vet
        run: go vet ./...

      - name: Run all Go tests
        run: go test ./...

      - name: Run integration tests
        run: make test-integration

  frontend:
    name: Frontend (install, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install + unit tests (CI entrypoint)
        run: bash scripts/test-frontend.sh

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  audit:
    name: Dependency audit (npm + Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: npm audit (production deps)
        working-directory: frontend
        run: npm audit --omit=dev
