version: '3.8'

services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: noumena_test
    ports:
      - "54320:5432"
    volumes:
      - ./internal/db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d noumena_test"]
      interval: 2s
      timeout: 2s
      retries: 10
